name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy on the pure crates
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # The pure crates (charset, engine, macro) build and test the same on every system.
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the pure crates
        run: cargo test --workspace --locked

  windows:
    # The tray app and the command line tool must build for all three Windows architectures.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy -p oh-key-app -p oh-key-cli --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - name: Build
        run: cargo build -p oh-key-app -p oh-key-cli --release --locked --target ${{ matrix.target }}
