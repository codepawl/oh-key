name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy on the pure crates
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # The pure crates (charset, engine, macro) build and test the same on every system.
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the pure crates
        run: cargo test --workspace --locked

  windows:
    # The tray app and the command line tool must build for all three Windows architectures.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy -p oh-key-app -p oh-key-cli --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - name: Build
        run: cargo build -p oh-key-app -p oh-key-cli --release --locked --target ${{ matrix.target }}

  macos-app:
    # The macOS input method: a universal (arm64 + x86_64) oh-key.app built with swiftc, no Xcode project.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app
      - name: Build the app
        run: bash macos/build.sh
      - name: Check the bundle and run the editor tests
        run: bash macos/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oh-key-macos
          path: target/mac/oh-key-macos.zip
          if-no-files-found: error

  hook-e2e:
    # Types through the real keyboard hook into the program's own windows. A hosted runner may
    # have no interactive desktop; the examples then exit with 2 before typing anything, which
    # is reported as a skipped check, not a failure. Never run these on a developer machine in
    # use: they take the foreground.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: hook-e2e
      - name: Build the hook examples
        run: cargo build -p oh-key-app --examples --locked --target x86_64-pc-windows-msvc
      - name: Run hook_suite and hook_e2e
        # Hosted runners give the suite a focusable window (runs 43194692427 and 43195361798
        # passed), so a mismatch here is a hook bug and fails the job.
        shell: pwsh
        timeout-minutes: 8
        run: |
          # The whole suite outlasts one watchdog, so it runs in parts (comma-separated filter).
          $runs = @(
            @{ Name = 'hook_suite'; Filter = 'basic,hard-rhymes,uppercase,capitalised,caps-lock' },
            @{ Name = 'hook_suite'; Filter = 'fast-5ms,backspace,english' },
            @{ Name = 'hook_suite'; Filter = 'toggle,digits,enter,tab,addr-' },
            @{ Name = 'hook_e2e'; Filter = '' }
          )
          $failed = $false
          foreach ($run in $runs) {
            $label = "$($run.Name) [$($run.Filter)]"
            & "target/x86_64-pc-windows-msvc/debug/examples/$($run.Name).exe" $run.Filter
            $code = $LASTEXITCODE
            if ($code -eq 0) {
              Write-Host "$label passed"
            } elseif ($code -eq 2 -or $code -eq 3) {
              Write-Host "::warning title=$label skipped::no usable foreground window or timed out on this runner (exit $code)"
            } else {
              Write-Host "::error title=$label failed::exit code $code"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Pin the hook timeout at its default
        # Windows drops a hook whose callback runs past this value; a fixed value makes the
        # stress runs below repeatable.
        shell: pwsh
        run: reg add "HKCU\Control Panel\Desktop" /v LowLevelHooksTimeout /t REG_DWORD /d 300 /f
      - name: Stress the hook (slow callbacks and busy cores)
        # The callback sleeps 60 ms on every third key event and every core is busy, so keys queue
        # up behind our own edits like on a loaded machine. Exit code 2 and 3 are skips, as above.
        shell: pwsh
        timeout-minutes: 8
        env:
          OHKEY_TEST_HOOK_DELAY_MS: '60'
          OHKEY_TEST_HOOK_DELAY_EVERY: '3'
        run: |
          # NUMBER_OF_PROCESSORS is a runner OS variable: the workflow env context cannot see it.
          $env:OHKEY_TEST_CPU_STRESS_THREADS = $env:NUMBER_OF_PROCESSORS
          Write-Host "busy threads: $($env:OHKEY_TEST_CPU_STRESS_THREADS)"
          $failed = $false
          foreach ($filter in @('fast-5ms,basic', 'hard-rhymes,backspace,english')) {
            & "target/x86_64-pc-windows-msvc/debug/examples/hook_suite.exe" $filter
            $code = $LASTEXITCODE
            if ($code -eq 0) {
              Write-Host "stress [$filter] passed"
            } elseif ($code -eq 2 -or $code -eq 3) {
              Write-Host "::warning title=stress [$filter] skipped::exit $code"
            } else {
              Write-Host "::error title=stress [$filter] failed::exit code $code"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Stress the hook with callbacks past the timeout
        # Every 20th key holds the callback for 350 ms, above the 300 ms timeout, so Windows
        # passes the key on and may remove the hook: the late-swallow and watchdog paths run.
        shell: pwsh
        timeout-minutes: 8
        env:
          OHKEY_TEST_HOOK_DELAY_MS: '350'
          OHKEY_TEST_HOOK_DELAY_EVERY: '20'
        run: |
          & "target/x86_64-pc-windows-msvc/debug/examples/hook_suite.exe" 'fast-5ms,basic'
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Host "late callbacks passed"
          } elseif ($code -eq 2 -or $code -eq 3) {
            Write-Host "::warning title=late callbacks skipped::exit $code"
          } else {
            Write-Host "::error title=late callbacks failed::exit code $code"
            exit 1
          }
      - name: Stress the hook with the fixes off (negative control)
        # Shows the symptom: with the fixes off the same load garbles text, so the suite should end
        # with exit code 1. Never fails the job; it prints what the load does to the old logic.
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 4
        env:
          OHKEY_DISABLE_MITIGATIONS: '1'
          OHKEY_TEST_HOOK_DELAY_MS: '60'
          OHKEY_TEST_HOOK_DELAY_EVERY: '3'
        run: |
          $env:OHKEY_TEST_CPU_STRESS_THREADS = $env:NUMBER_OF_PROCESSORS
          Write-Host "busy threads: $($env:OHKEY_TEST_CPU_STRESS_THREADS)"
          & "target/x86_64-pc-windows-msvc/debug/examples/hook_suite.exe" 'fast-5ms,basic'
          $code = $LASTEXITCODE
          if ($code -eq 1) {
            Write-Host "::notice title=negative control::the load breaks the old logic, as expected (exit 1)"
          } else {
            Write-Host "::warning title=negative control::exit $code, the load did not break the old logic here"
          }
          exit 0
