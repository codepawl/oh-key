# Footage branch only: records the real oh-key typing on a hosted runner for the showreel.
name: footage
on:
  push:
    branches: [footage/real-capture]
  workflow_dispatch:
jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: footage
      - name: Build the app
        run: cargo build -p oh-key-app --release --locked --target x86_64-pc-windows-msvc
      - name: Install ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          ffmpeg -version | Select-Object -First 1
      - name: Record
        shell: pwsh
        timeout-minutes: 12
        run: ./tools/footage/record.ps1 -OhKeyExe "$PWD/target/x86_64-pc-windows-msvc/release/oh-key.exe" -OutFolder "$env:RUNNER_TEMP/footage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footage
          path: ${{ runner.temp }}/footage
