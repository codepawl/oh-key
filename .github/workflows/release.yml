name: release

on:
  push:
    tags: ["v*"]
  # A dry run: every package is built and the installer is tried, nothing is published.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/**
      - macos/**
  workflow_dispatch:

# Only dry runs on pull requests are replaced by a newer push; tag runs publish and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default: the build jobs run third-party actions. Only the publish jobs write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # One build per architecture: the tray app (oh-key.exe) and the command line tool.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Check that the tag matches the version in Cargo.toml
        if: matrix.arch == 'x64' && github.ref_type == 'tag'
        shell: bash
        run: |
          workspace_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_NAME#v}" != "$workspace_version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml says $workspace_version. Bump the version in Cargo.toml, commit, then tag."
            exit 1
          fi
      - name: Test the pure crates and the app
        if: matrix.arch == 'x64' && github.ref_type == 'tag'
        run: cargo test --workspace --release --locked
      - name: Build the app and the command line tool
        run: cargo build -p oh-key-app -p oh-key-cli --release --locked --target ${{ matrix.target }}
      - name: Smoke test the x64 build
        # --version must print "oh-key <Cargo.toml version>", which on a tag was checked against the
        # tag above. crash-test must die on purpose: a non-zero exit proves the crash path runs. Its
        # exit code is not pinned (the app lane owns it).
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/oh-key.exe"
          expected_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          version_output="$(timeout 30 "$exe" --version)"
          echo "oh-key --version printed: $version_output"
          if [ "$version_output" != "oh-key $expected_version" ]; then
            echo "::error::--version printed '$version_output', expected 'oh-key $expected_version'"
            exit 1
          fi
          set +e
          timeout 60 "$exe" crash-test
          crash_exit_code=$?
          set -e
          echo "oh-key crash-test exit code: $crash_exit_code"
          if [ "$crash_exit_code" -eq 0 ] || [ "$crash_exit_code" -eq 124 ]; then
            echo "::error::crash-test must exit non-zero without hanging (got $crash_exit_code)"
            exit 1
          fi
      - name: Collect the binaries
        shell: bash
        run: |
          release_dir="target/${{ matrix.target }}/release"
          mkdir build
          cp "$release_dir/oh-key.exe" "$release_dir/oh-key-cli.exe" build/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.arch }}
          path: build
          if-no-files-found: error
          retention-days: 1

  macos:
    # The macOS input method, one universal zip.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build oh-key.app
        run: bash macos/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oh-key-macos-zip
          path: target/mac/oh-key-macos.zip
          if-no-files-found: error
          retention-days: 1

  source:
    # GPL: every release carries the complete source of exactly the tagged commit. git archive
    # writes the tracked files at the tag, so the zip matches the built files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Archive the tagged source
        run: git archive --format=zip --prefix="oh-key-${GITHUB_REF_NAME#v}/" -o oh-key-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oh-key-source
          path: oh-key-source.zip
          if-no-files-found: error
          retention-days: 1

  package:
    # One zip per architecture, with oh-key.exe and oh-key-cli.exe at the top.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: builds
      - name: Assemble the zips
        run: |
          for arch in x64 x86 arm64; do
            package="oh-key-windows-$arch"
            mkdir -p "$package"
            cp "builds/build-$arch/oh-key.exe" "builds/build-$arch/oh-key-cli.exe" "$package/"
            cp LICENSE NOTICE README.md "$package/"
            (cd "$package" && zip -r "../$package.zip" .)
            # The updater downloads the bare exe, not the zip.
            cp "builds/build-$arch/oh-key.exe" "$package.exe"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oh-key-windows-assets
          path: |
            oh-key-windows-*.zip
            oh-key-windows-*.exe
          if-no-files-found: error
          retention-days: 1

  installer:
    # oh-key-setup.exe, the one-click installer for every Windows (installer/oh-key.iss). It is
    # installed, run and uninstalled here once, silently, before anyone can download it.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-*
          path: builds
      - name: Build oh-key-setup.exe
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup.' }
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $compiler "/DAppVersion=$version" "/DBuildFolder=$PWD\builds" installer\oh-key.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }
      - name: Install, run and uninstall it silently
        shell: pwsh
        run: |
          $setup = Start-Process installer\output\oh-key-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup exited with $($setup.ExitCode)." }
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\oh-key'
          $installed = Join-Path $folder 'oh-key.exe'
          if (-not (Test-Path $installed)) { throw "Setup did not install $installed." }
          # oh-key.exe is a GUI program: PowerShell neither waits for it nor reads its output
          # unless it goes through Start-Process.
          $versionFile = Join-Path $env:RUNNER_TEMP 'installed-version.txt'
          Start-Process $installed -ArgumentList '--version' -Wait -NoNewWindow -RedirectStandardOutput $versionFile
          [string]$printed = (Get-Content $versionFile -Raw).Trim()
          $expected = 'oh-key ' + (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "installed oh-key --version printed: $printed"
          if ($printed -ne $expected) { throw "--version printed '$printed', expected '$expected'." }
          $runValue = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'oh-key').'oh-key'
          if ($runValue -ne "`"$installed`"") { throw "Run value is $runValue." }
          $uninstall = Start-Process (Join-Path $folder 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall exited with $($uninstall.ExitCode)." }
          # The uninstaller removes itself from a copy in Temp just after it returns.
          Start-Sleep -Seconds 5
          if (Test-Path $installed) { throw 'Uninstall left oh-key.exe behind.' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'oh-key' -ErrorAction SilentlyContinue) { throw 'Uninstall left the Run value.' }
          Write-Host 'Install and uninstall passed.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oh-key-setup
          path: installer/output/oh-key-setup.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    # The private repository's own release, with notes generated from its pull requests.
    # A failed installer build does not block the zips and exes.
    needs: [package, source, installer]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.package.result == 'success' && needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oh-key-windows-assets
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: oh-key-setup
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oh-key-source
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum oh-key-windows-* oh-key-source.zip $(ls oh-key-setup.exe 2>/dev/null) | tee SHA256SUMS.txt
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes

  publish-macos:
    # Attached after the Windows release exists, so a failed macOS build never blocks it.
    needs: [publish, macos]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oh-key-macos-zip
          path: dist
      - name: Add the macOS zip to SHA256SUMS.txt and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern SHA256SUMS.txt --dir dist
          cd dist
          sha256sum oh-key-macos.zip | tee -a SHA256SUMS.txt
          gh release upload "$TAG" oh-key-macos.zip SHA256SUMS.txt --clobber \
            --repo "${{ github.repository }}"

  publish-public:
    # The public releases repo gets one complete release in one step: every file and one
    # SHA256SUMS.txt, so the updater never sees a half-filled release or a missing list. A failed
    # macOS or Linux build or installer does not block the Windows files.
    # Never without the source zip: binaries alone would break the GPL.
    needs: [package, macos, linux, source, installer]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.package.result == 'success' && needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    # Keep RELEASES_TOKEN in this environment's secrets and give the environment required reviewers
    # and a tag rule, so a branch with a changed workflow cannot read the token.
    environment: public-release
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      PUBLIC_REPO: codepawl/oh-key-releases
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oh-key-windows-assets
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: oh-key-macos-zip
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: oh-key-linux-packages
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: oh-key-setup
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oh-key-source
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum oh-key-windows-* oh-key-source.zip $(ls oh-key-macos.zip oh-key-linux-x86_64.tar.gz oh-key_*_amd64.deb oh-key-setup.exe 2>/dev/null) | tee SHA256SUMS.txt
      - name: Create the public release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN is not set, so $TAG was not published to $PUBLIC_REPO. Run tools/publish-release.ps1 to publish it."
            exit 0
          fi
          # Written here, not copied from the private release: its notes name pull requests and people.
          printf 'oh-key %s\n\nBuilt files, their source code (oh-key-source.zip, GPL-3.0-or-later) and SHA256SUMS.txt. The app updates itself from this page.\n' "${TAG#v}" > release-notes.md
          # A tag like v0.2.0-rc.1 is a pre-release: the download page, install.ps1 and the updater
          # all follow releases/latest, which skips pre-releases.
          prerelease_flag=""
          case "$TAG" in *-*) prerelease_flag="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$PUBLIC_REPO" \
            --title "$TAG" \
            --notes-file release-notes.md \
            $prerelease_flag

  linux:
    # The Linux IBus engine: a tarball with an install script, and a deb.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install the IBus development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libibus-1.0-dev pkg-config
      - name: Build the packages
        run: bash linux/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oh-key-linux-packages
          path: |
            target/linux/oh-key-linux-x86_64.tar.gz
            target/linux/oh-key_*_amd64.deb
          if-no-files-found: error
          retention-days: 1

  publish-linux:
    # Attached after the release exists and after the macOS step, which also rewrites
    # SHA256SUMS.txt, so a failed Linux build never blocks the others.
    needs: [publish, linux, publish-macos]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oh-key-linux-packages
          path: dist
      - name: Add the Linux packages to SHA256SUMS.txt and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern SHA256SUMS.txt --dir dist
          cd dist
          sha256sum oh-key-linux-x86_64.tar.gz oh-key_*_amd64.deb | tee -a SHA256SUMS.txt
          gh release upload "$TAG" oh-key-linux-x86_64.tar.gz oh-key_*_amd64.deb SHA256SUMS.txt --clobber \
            --repo "${{ github.repository }}"
