name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # One build per architecture: the tray app (oh-key.exe) and the command line tool.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test the pure crates and the app
        if: matrix.arch == 'x64'
        run: cargo test --workspace --release --locked
      - name: Build the app and the command line tool
        run: cargo build -p oh-key-app -p oh-key-cli --release --locked --target ${{ matrix.target }}
      - name: Collect the binaries
        shell: bash
        run: |
          release_dir="target/${{ matrix.target }}/release"
          mkdir build
          cp "$release_dir/oh-key.exe" "$release_dir/oh-key-cli.exe" build/
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: build
          if-no-files-found: error

  package:
    # One zip per architecture, with oh-key.exe and oh-key-cli.exe at the top.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - name: Assemble the zips
        run: |
          for arch in x64 x86 arm64; do
            package="oh-key-windows-$arch"
            mkdir -p "$package"
            cp "builds/build-$arch/oh-key.exe" "builds/build-$arch/oh-key-cli.exe" "$package/"
            cp LICENSE README.md "$package/"
            (cd "$package" && zip -r "../$package.zip" .)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: oh-key-windows-zips
          path: oh-key-windows-*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oh-key-windows-zips
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip | tee SHA256SUMS.txt
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
