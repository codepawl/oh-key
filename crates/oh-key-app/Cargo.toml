[package]
name = "oh-key-app"
description = "The oh-key tray app: mode icon, control panel and shared state publisher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oh-key"
path = "src/main.rs"

[dependencies]
oh-key-engine = { path = "../oh-key-engine" }
oh-key-ipc = { path = "../oh-key-ipc" }
oh-key-macro = { path = "../oh-key-macro" }
oh-key-charset = { path = "../oh-key-charset" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Wdk_System_SystemServices",
    # Not called directly. Without it, HRESULT::message() crashes on the GNU toolchain.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# The example's COM autocomplete source uses the `implement` macro, which names this crate.
[target.'cfg(windows)'.dev-dependencies]
windows-core = "0.62"
