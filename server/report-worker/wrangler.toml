name = "oh-key-report"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# Create with `npx wrangler kv namespace create REPORTS`, then put the id here.
[[kv_namespaces]]
binding = "REPORTS"
id = "ae523d59b5a04a6baf6a0f4058c1ceac"

[vars]
GITHUB_REPO = "codepawl/oh-key"
MAX_REPORTS_PER_IP_PER_HOUR = "10"
MAX_NEW_ISSUES_PER_DAY = "30"
MAX_NEW_LOW_PRIORITY_ISSUES_PER_DAY = "10"

# Secret, set by the owner: `npx wrangler secret put GITHUB_TOKEN`
